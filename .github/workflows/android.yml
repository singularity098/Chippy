name: Android

# Builds the Android APK (arm64) on every push. Download it from the run's
# "Artifacts" section on the Actions tab; a v* tag also attaches it to the
# GitHub release. Every build is signed with the same (public) key, kept in
# android/app/chippy-ci.keystore, so each APK installs over the last.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      # FFmpeg, mpg123, libvorbis and libogg for vgmstream, built once and
      # kept until the script that builds them changes.
      - name: Cache the codec libraries
        uses: actions/cache@v4
        with:
          path: build/codecs/arm64-v8a
          key: android-deps-${{ env.NDK_VERSION }}-${{ hashFiles('packaging/build-codecs.sh') }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "chippy") | .version')-$(git rev-parse --short HEAD)"
          fi
          export CHIPPY_VERSION_NAME="$version"
          export CHIPPY_VERSION_CODE="$GITHUB_RUN_NUMBER"
          android/build-apk.sh release
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Chippy-$version.apk"
          echo "APK=Chippy-$version.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: dist/${{ env.APK }}
          if-no-files-found: error
          compression-level: 0

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APK }}
