name: AppImage

# Builds a Linux AppImage on every push. Download it from the run's
# "Artifacts" section on the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  appimage:
    # The oldest supported runner, so the AppImage runs on as many
    # distributions as possible (it needs glibc 2.35 or newer).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config file \
            libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig-dev zlib1g-dev \
            libmpg123-dev libvorbis-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: appimage

      - name: Build
        run: cargo build --release --locked -p chippy

      - name: Package
        env:
          # Runners have no FUSE; the tools unpack themselves instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          version="$(git describe --tags --always)"
          echo "LINUXDEPLOY_OUTPUT_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p appimage-tools appimage-build
          curl -fsSL -o appimage-tools/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x appimage-tools/linuxdeploy
          cp assets/chippy-icon.svg appimage-build/chippy.svg
          # winit loads the keyboard libraries at run time, so they are not
          # found by following the binary's links: add them by hand.
          LINUXDEPLOY_OUTPUT_VERSION="$version" ./appimage-tools/linuxdeploy \
            --appdir AppDir \
            --executable target/release/chippy \
            --desktop-file packaging/linux/chippy.desktop \
            --icon-file appimage-build/chippy.svg \
            --library /usr/lib/x86_64-linux-gnu/libxkbcommon.so.0 \
            --library /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so.0 \
            --output appimage
          ls -l Chippy-*.AppImage
          echo "APPIMAGE=$(ls Chippy-*.AppImage)" >> "$GITHUB_ENV"

      - name: Smoke test
        run: |
          ./"$APPIMAGE" --appimage-extract >/dev/null
          # Every library the binary needs must resolve.
          ! ldd squashfs-root/usr/bin/chippy | grep "not found"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APPIMAGE }}
          path: ${{ env.APPIMAGE }}
          if-no-files-found: error
