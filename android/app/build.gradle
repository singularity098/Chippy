// Chippy's Android app: a Jetpack Compose UI (Kotlin) over the Rust engine,
// which cargo-ndk builds into src/main/jniLibs and UniFFI gives Kotlin
// bindings for, in build/generated/uniffi (both by build-apk.sh).
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

// The version: CHIPPY_VERSION_NAME when CI sets it (a v* tag's number),
// otherwise the Cargo workspace's version and the commit built, so every
// APK, local or from CI, says what it is in its name and in the app.
def cargoVersion = (rootProject.file("../Cargo.toml").text =~ /(?m)^version\s*=\s*"([^"]+)"/)[0][1]
def commit = ""
try {
    def git = ["git", "-C", rootDir.path, "rev-parse", "--short", "HEAD"].execute()
    def out = git.text.trim()
    if (git.waitFor() == 0) commit = out
} catch (ignored) {
    // No git: the version alone.
}
def appVersion = System.getenv("CHIPPY_VERSION_NAME") ?: [cargoVersion, commit].findAll().join("-")

android {
    namespace "io.github.singularity098.chippy"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "io.github.singularity098.chippy"
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv("CHIPPY_VERSION_CODE") ?: "1")
        versionName appVersion
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        // A key kept in the repository on purpose: every build, local or
        // from CI, is signed the same way, so each new APK installs over
        // the last. It protects nothing; it is not a release key.
        ci {
            storeFile file("chippy-ci.keystore")
            storePassword "chippy-ci"
            keyAlias "chippy"
            keyPassword "chippy-ci"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ci
        }
        debug {
            signingConfig signingConfigs.ci
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        // The engine's Kotlin bindings, generated from the Rust library.
        main.java.srcDirs += "build/generated/uniffi"
    }

    // Chippy-<version>.apk (and Chippy-<version>-debug.apk) instead of app-release.apk.
    applicationVariants.all { variant ->
        variant.outputs.all {
            def type = variant.buildType.name == "release" ? "" : "-${variant.buildType.name}"
            outputFileName = "Chippy-${variant.versionName}${type}.apk"
        }
    }

    packagingOptions {
        jniLibs {
            // The libraries are loaded from the APK as they are.
            useLegacyPackaging false
        }
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2024.12.01")
    implementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    // UniFFI's Kotlin bindings call the Rust library through JNA.
    implementation "net.java.dev.jna:jna:5.15.0@aar"
}
