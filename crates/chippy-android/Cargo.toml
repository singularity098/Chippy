[package]
name = "chippy-android"
description = "Chippy for Android: the engine the Compose app drives, exposed to Kotlin through UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chippy_android"
# cdylib for the app; lib so the tests (and the bindings generator) can
# use it on the desktop too.
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[dependencies]
chippy-core.workspace = true
chippy-engine = { path = "../chippy-engine" }
anyhow.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
rustysynth = "1.3.8"
uniffi = "0.29.5"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger.workspace = true

[dev-dependencies]
tempfile.workspace = true
