[package]
name = "chippy-core"
description = "Chippy's engine: file navigation (folders, archives, multi-track files), decoders, metadata and album art"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["vgmstream"]
# Hundreds of game audio formats (ADX, BRSTM, HCA...), with FFmpeg,
# mpg123 and libvorbis. Left out where only notes are wanted (Tabby).
vgmstream = ["dep:vgmstream-sys"]

[dependencies]
gme-sys.workspace = true
vgmstream-sys = { workspace = true, optional = true }
lazyusf-sys.workspace = true
aosdk-sys.workspace = true
archive-sys.workspace = true
sidplayfp-sys.workspace = true
gsf-sys.workspace = true
twosf-sys.workspace = true
wsr-sys.workspace = true
xmp-sys.workspace = true
tablature.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.22"
# Opus in WebM/Matroska, which Symphonia cannot decode.
opus = "0.3"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64"] }
sevenz-rust = "0.6"
tar = "0.4"
flate2 = "1"
rand = "0.8"
rustysynth = "1.3.8"
iz80 = "0.5.1"

[dev-dependencies]
tempfile.workspace = true
