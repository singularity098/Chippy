[package]
name = "chippy"
description = "A chiptune-focused music player with a file browser instead of a library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "chippy"
path = "src/main.rs"

[features]
default = ["skia"]
# Skia antialiases curves and thin lines far better than femtovg (as in
# Carlita). Build with `--no-default-features` to use femtovg only, e.g.
# where Skia's prebuilt binaries cannot be downloaded.
skia = ["slint/renderer-skia-opengl"]

[dependencies]
chippy-core.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
cpal = "0.15"
rubato = "0.15"
rustfft = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
rustysynth = "1.3.8"
# Exporting: FLAC (pure Rust), MP3 (LAME, built from source), Opus in Ogg.
flacenc = "0.5"
mp3lame-encoder = "0.2"
opus = "0.3"
ogg = "0.9"
lofty = "0.22"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "~1.14", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    # Moving and resizing the frameless window with the window manager.
    "unstable-winit-030",
] }
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
# The system's file and folder pickers (XDG portal on Linux).
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "~1.14", default-features = false, features = [
    "std",
    "compat-1-2",
    # Drawn with Skia, the Android backend's renderer.
    "backend-android-activity-06",
] }
android_logger = "0.15"
# Calls into the app's Java side (media session, permissions).
jni = "0.21"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
slint-build = "~1.14"
