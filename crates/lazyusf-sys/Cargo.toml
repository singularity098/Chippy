[package]
name = "lazyusf-sys"
description = "Raw bindings to lazyusf2 (Nintendo 64 USF playback), built from third_party/lazyusf2"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-or-later"
links = "lazyusf"
build = "build.rs"

[build-dependencies]
cc = "1"

[dependencies]
# lazyusf2 hashes code blocks with zlib's adler32.
libz-sys = "1"
