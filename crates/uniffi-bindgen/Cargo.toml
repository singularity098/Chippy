[package]
name = "uniffi-bindgen"
description = "Generates the Kotlin bindings of chippy-android (run by android/build-apk.sh)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
# The same version as chippy-android's.
uniffi = { version = "0.29.5", features = ["cli"] }
